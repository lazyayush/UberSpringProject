spring:
  application:
    name: UberLocationService

  datasource:
    url: jdbc:mysql://localhost:3306/UberDB
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

  data:
    redis:
      host: localhost
      port: 6380

server:
  port: 7477

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    preferIpAddress: true
