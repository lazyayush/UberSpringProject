spring:
  application:
    name: UberApiGateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://UBERAUTHSERVICE
          predicates:
            - Path=/api/v1/auth/**

        - id: booking-service
          uri: lb://UBERBOOKINGSERVICE
          predicates:
            - Path=/api/v1/booking/**

        - id: location-service
          uri: lb://UBERLOCATIONSERVICE
          predicates:
            - Path=/api/location/**

        - id: socket-server
          uri: lb://UBERSOCKETSERVER
          predicates:
            - Path=/ws/**, /api/socket/**

        - id: review-service
          uri: lb://UBERREVIEWSERVICE
          predicates:
            - Path=/api/v1/reviews/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    preferIpAddress: true

jwt:
  secret: ${JWT_SECRET}
  expiry: 604800000
