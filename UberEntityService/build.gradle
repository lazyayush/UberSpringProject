plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'maven-publish'
}

group = 'com.app'
version = '0.0.6-SNAPSHOT'
description = 'Uber Entity Service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

tasks.named('jar'){
	enabled = true
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

tasks.withType(GenerateModuleMetadata).configureEach {
	suppressedValidationErrors.add('dependencies-without-versions')
}

publishing {
	publications {
		mavenJava(MavenPublication){
			from components.java
			groupId = 'com.app'
			artifactId = 'UberEntityService'
			version = '0.0.6-SNAPSHOT'
		}
	}

	repositories {
		maven {
			url = uri('D:\\SpringBoot\\SpringBoot\\UberSpringProject\\UberEntityService')
		}
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation("org.springframework.boot:spring-boot-starter-validation:3.5.6")
}

tasks.named('test') {
	useJUnitPlatform()
}
